# AI 日报信源配置
# 最后更新: 2026-10-26
# 所有 enabled: true 的信源均已实测可访问（2026-10-26 验证）
#
# 层级说明:
#   T1 官方一手   - 模型发布、官方博客，准确性最高，全收
#   T2 聚合媒体   - 行业新闻，国内外平衡
#   T3 社区/项目  - 开源项目、新产品、技术圈热度
#   T4 深度写作   - 低频高质的个人写作
#   T5 论文       - HF 社区精选为主，arXiv 原始流经 LLM 强过滤，公众号中文解读

